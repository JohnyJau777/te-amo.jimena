<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo Jimena</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffdde1, #ee9ca7, #ff758c);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .content {
    text-align: center;
    z-index: 2;
    padding: 20px;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.25);
    letter-spacing: 2px;
    animation: pulse 1.8s ease-in-out infinite;
  }

  .heart {
    display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
    color: #fff;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25% { transform: scale(1.3); }
    50% { transform: scale(1); }
    75% { transform: scale(1.3); }
  }

  .subtitle {
    margin-top: 20px;
    color: #fff;
    font-size: clamp(1rem, 3vw, 1.4rem);
    opacity: 0.9;
    font-weight: 300;
    letter-spacing: 1px;
  }

  canvas {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
  }
</style>
</head>
<body>

<canvas id="hearts"></canvas>

<div class="content">
  <h1>TE AMO <span class="heart">♥</span> JIMENA</h1>
  <p class="subtitle">Eres lo mejor que me ha pasado</p>
</div>

<script>
  const canvas = document.getElementById('hearts');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const hearts = [];
  const heartCount = 35;

  function createHeart() {
    return {
      x: Math.random() * canvas.width,
      y: canvas.height + Math.random() * 100,
      size: Math.random() * 18 + 8,
      speed: Math.random() * 1.5 + 0.5,
      drift: Math.random() * 1 - 0.5,
      opacity: Math.random() * 0.5 + 0.3,
      rotation: Math.random() * 360
    };
  }

  for (let i = 0; i < heartCount; i++) {
    hearts.push(createHeart());
  }

  function drawHeart(x, y, size, opacity, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate((rotation * Math.PI) / 180);
    ctx.globalAlpha = opacity;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    const topCurveHeight = size * 0.3;
    ctx.moveTo(0, topCurveHeight);
    ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, topCurveHeight);
    ctx.bezierCurveTo(-size / 2, size * 0.6, 0, size * 0.8, 0, size);
    ctx.bezierCurveTo(0, size * 0.8, size / 2, size * 0.6, size / 2, topCurveHeight);
    ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, topCurveHeight);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hearts.forEach(h => {
      h.y -= h.speed;
      h.x += h.drift;
      if (h.y < -50) {
        Object.assign(h, createHeart(), { y: canvas.height + 50 });
      }
      drawHeart(h.x, h.y, h.size, h.opacity, h.rotation);
    });
    requestAnimationFrame(animate);
  }

  animate();
</script>

</body>
</html>
